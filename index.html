<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xooxle AI</title>
<style>
body{margin:0;font-family:Arial;background:linear-gradient(180deg,#1a1033,#2d1b69);color:white;min-height:100vh;text-align:center}
.logo{font-size:50px;font-weight:900;margin-top:30px;background:linear-gradient(90deg,#00d4ff,#a100ff,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.chat{background:white;color:#333;max-width:600px;margin:15px auto;border-radius:25px;padding:15px;min-height:300px;text-align:right}
.msg{padding:12px;margin:8px 0;border-radius:15px;max-width:95%;line-height:1.7}
.user{background:#dcf8c6;margin-left:auto}
.ai{background:#e9e0ff}
img.gen{width:100%;border-radius:12px;margin-top:8px}
img.wiki{width:100%;border-radius:12px;margin-top:8px}
.bar{max-width:600px;margin:10px auto;display:flex;gap:8px;padding:5px 10px;align-items:center;background:white;border-radius:30px}
.bar input{flex:1;padding:12px;border:none;outline:none;font-size:16px;text-align:right}
.mic{width:48px;height:48px;border-radius:50%;border:none;background:#00c853;color:white;font-size:22px}
.send{width:48px;height:48px;border-radius:50%;border:none;background:#00e5c0;font-size:22px}
</style>
</head>
<body>
<div class="logo">Xooxle AI</div>
<p>Salam! Ana XooxleAI dyal FARAIK CASA ❤️🔥<br>Kteb ay haja: assad, اليابان, سوريا...</p>
<div class="chat" id="chat"></div>
<div class="bar">
<input id="inp" placeholder="Kteb hna ay haja...">
<button class="mic" onclick="startVoice()">🎤</button>
<button class="send" onclick="doChat()">➤</button>
</div>
<script>
let chat=document.getElementById('chat');
function add(who,t){let d=document.createElement('div');d.className='msg '+who;d.innerHTML=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
async function doChat(){
let t=document.getElementById('inp').value.trim();if(!t)return;
add('user',t);document.getElementById('inp').value='';
let low=t.toLowerCase();
let animal=null;
if(low.includes('أسد')||low.includes('assad')||low.includes('asad')||low.includes('lion')) animal='majestic lion';
else if(low.includes('قطة')||low.includes('qetta')||low.includes('cat')) animal='cute kitten cat';
else if(low.includes('كلب')||low.includes('kelb')||low.includes('dog')) animal='cute happy dog';
else if(low.includes('حصان')||low.includes('hssan')||low.includes('horse')) animal='beautiful horse';
else if(low.includes('فيل')||low.includes('fil')||low.includes('elephant')) animal='cute elephant';
else if(low.includes('ورد')||low.includes('ward')||low.includes('rose')) animal='beautiful red roses';
else if(low.includes('نمر')||low.includes('namir')||low.includes('tiger')) animal='beautiful tiger';
if(animal && (low.includes('رسم')||low.includes('rsem')||low.includes('sawer')||low.includes('taswira')||low.includes('draw')||t.length<15)){
let url='https://image.pollinations.ai/prompt/'+encodeURIComponent(animal)+'?width=512&height=512&seed='+Math.floor(Math.random()*9999)+'&nologo=true';
add('ai','Hahiya taswira dyal <b>'+t+'</b>! 🎨😍<br><img class="gen" src="'+url+'">');return;
}
if(low.includes('قصة')||low.includes('qissa')||low.includes('story')){
add('ai','Hahiya qissa lik! 📖❤️<br><br>Kan ya makan, f wahed lmdina sghira... kanet wahed lbent smiytha Salma, katbghi lqitat bzaf! 🐱<br><br>Wahed nhar, lqat qetta sghira day3a f zenqa. Salma hazatha, 3tatha l7lib, w wlat sahbtha lkbira.<br><br>W 3acho f sa3ada! ❤️');return;
}
let loading=add('ai','Kan qleb lik 3la <b>'+t+'</b>... 🔍⏳');
try{
let res=await fetch('https://ar.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(t));
let data=await res.json();
if(data.extract){
let img=data.thumbnail?'<br><img class="wiki" src="'+data.thumbnail.source+'">':'';
loading.innerHTML='<b>'+data.title+'</b> 🌍<br><br>'+data.extract+img+'<br><br><a href="https://ar.wikipedia.org/wiki/'+encodeURIComponent(t)+'" target="_blank">📖 Qra ktr hna</a>';
}else{
loading.innerHTML='Lqit lik hada 3la <b>'+t+'</b> ❤️<br><br><a href="https://www.google.com/search?q='+encodeURIComponent(t)+'" target="_blank">🔍 Chof f Google hna</a>';
}
}catch(e){
loading.innerHTML='Hahiya <b>'+t+'</b> ❤️<br><br><a href="https://www.google.com/search?q='+encodeURIComponent(t)+'" target="_blank">🔍 Chof f Google hna</a>';
}
}
function startVoice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){document.getElementById('inp').focus();alert('وركي على 🎤 ديال الكلافيي');return}let r=new SR();r.lang='ar-MA';r.start();r.onresult=e=>{document.getElementById('inp').value=e.results[0][0].transcript;doChat()}}
document.getElementById('inp').addEventListener('keypress',e=>{if(e.key==='Enter')doChat()});
add('ai','Salam! ❤️ Kteb ay haja bghiti:<br><b>أسد</b> 🦁 <b>اليابان</b> 🇯🇵 <b>سوريا</b> <b>قصة</b> 📖');
</script>
</body>
</html>
