<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XooxleAI - FARAIK CASA</title>
<style>
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);margin:0;text-align:center;color:white;min-height:100vh}
header{padding:20px}
.logo{font-size:48px;font-weight:900;background:linear-gradient(90deg,#ff00cc,#00ffcc,#ffcc00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.chat{max-width:600px;margin:15px auto;background:white;color:#333;border-radius:20px;padding:15px;min-height:250px;max-height:400px;overflow-y:auto;text-align:left}
.msg{padding:10px;margin:8px 0;border-radius:12px;max-width:90%}
.user{background:#dcf8c6;margin-left:auto}
.ai{background:#e8e0ff}
img.gen{width:100%;border-radius:10px;margin-top:5px}
.inputBox{display:flex;gap:5px;max-width:600px;margin:0 auto 20px;padding:0 10px;align-items:center;background:white;border-radius:30px;padding:5px}
.inputBox input{flex:1;padding:12px;border:none;outline:none;font-size:16px}
.micBtn{width:45px;height:45px;border-radius:50%;border:none;background:#00c853;color:white;font-size:22px}
.sendBtn{width:45px;height:45px;border-radius:50%;border:none;background:#00ffcc;font-size:20px}
.topBtns button{padding:10px 15px;border:none;border-radius:20px;background:rgba(255,255,255,0.2);color:white;margin:5px}
</style>
</head>
<body>
<header><div class="logo">Xooxle AI</div><p>Salam! Ana XooxleAI dyal FARAIK CASA ❤️🔥</p></header>
<div class="topBtns"><button onclick="speakLast()">🔊 سمع الجواب</button><button onclick="clearMemory()">🗑️ مسح الذاكرة</button></div>
<div class="chat" id="chat"></div>
<div class="inputBox">
<input id="inp" placeholder="Sowlni hna...">
<button class="micBtn" onclick="startVoice()">🎤</button>
<button class="sendBtn" onclick="send()">➤</button>
</div>
<p style="font-size:12px;opacity:0.7">إلا ما خدمش الميكرو، وركي على 🎤 ديال الكلافيي ديالك بحال واتساب</p>
<script>
let chat=document.getElementById('chat');
let lastAI="";
let history=JSON.parse(localStorage.getItem('xooxle_history')||'[]');
function show(){chat.innerHTML='';history.forEach(h=>{let d=document.createElement('div');d.className='msg '+h.who;d.innerHTML=h.text;chat.appendChild(d)});chat.scrollTop=chat.scrollHeight}
show();
function save(who,text){history.push({who,text});localStorage.setItem('xooxle_history',JSON.stringify(history));show()}
function send(){
let i=document.getElementById('inp');let t=i.value.trim();if(!t)return;save('user',t);i.value='';
let low=t.toLowerCase();
let isDraw = low.includes('rsem')||low.includes('draw')||low.includes('sawer')||low.includes('taswira')||low.includes('رسم')||low.includes('صورة')||low.includes('قطة')||low.includes('qetta')||low.includes('qet');
if(isDraw){
let prompt='cute cat';
if(low.includes('kelb')||low.includes('كلب')||low.includes('dog')) prompt='cute happy dog';
if(low.includes('ward')||low.includes('ورد')) prompt='beautiful roses flowers';
let url='https://image.pollinations.ai/prompt/'+encodeURIComponent(prompt)+'?width=512&height=512&seed='+Math.floor(Math.random()*9999)+'&nologo=true';
let html='Hahiya taswira dyalek! 🎨<br><img class="gen" src="'+url+'"><br>3jbatek? 😍';
lastAI='Hahiya taswira dyalek';
save('ai',html);return}
let r="Fhemtk: "+t+"<br>Bagha nrsem lik chi taswira? Goli 'rsem liya qetta' 😍";
if(low.includes('salam')||low.includes('سلام'))r="Wa 3alaykom salam! Kidayra? ❤️ Ana 3aql 3lik hit 3endi dakira!";
if(low.includes('chkon')||low.includes('شكون'))r="Ana Xooxle AI dyal FARAIK CASA! Kan3qel 3lik 💾";
lastAI=r;save('ai',r)}
function speakLast(){if(!lastAI)return;let u=new SpeechSynthesisUtterance(lastAI.replace(/<[^>]*>/g,''));u.lang='ar-MA';speechSynthesis.speak(u)}
function clearMemory(){localStorage.removeItem('xooxle_history');history=[];show();alert('Tmeshat dakira!')}
function startVoice(){
let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){
// إلا التيليفون ما كيدعمش، نفتحو الكلافيي و نطلبو الميكرو ديالو بحال واتساب
document.getElementById('inp').focus();
alert('وركي على 🎤 اللي في الكلافيي ديالك الفوق بحال واتساب و هضري!');
return}
let rec=new SR();rec.lang='ar-MA';rec.start();
rec.onresult=e=>{document.getElementById('inp').value=e.results[0][0].transcript;send()}
rec.onerror=()=>{document.getElementById('inp').focus();alert('جربي الميكرو ديال الكلافيي 🎤 بحال واتساب')}
}
document.getElementById('inp').addEventListener('keypress',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
